[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warera-marketguide"
version = "0.1.0"
description = "WarEra Market Guide - aggressive decision-support tool for trading in the WarEra in-game market"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "WarEra Market Guide Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "mplfinance>=0.12.10b0",
    "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
]

[project.scripts]
warera-marketguide = "warera_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warera_quant = ["py.typed"]
