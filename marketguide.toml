[housekeeping]
# Raw market data older than this is deleted when --housekeeping is run.
# Increasing this later cannot restore data that has already been pruned.
enabled = true
retention_days = 120

# Rebuild the database at most this often when housekeeping finds deleted pages.
# SQLite reuses deleted pages between rebuilds. Set to 0 to disable compaction.
vacuum_interval_days = 30

# Display periods are CLI generation settings: --item-chart-days 7 --chart-interval 1h
# --we23-days 30; optional --research-days 90. Download uses --lookback-days.
